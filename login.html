<!DOCTYPE html>
<html>

<head>
    <title>RideNest Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

<div class="full-screen">
    <div class="header">

        <div class="nav-bar">

            <div class="title">
                RideNest
            </div>

            <div class="tabs">
                <div class="tab active">Home</div>
                <div class="tab">Find Ride</div>
                <div class="tab">Post Ride</div>
                <div class="tab">My Rides</div>
                <div class="tab">Chat</div>
                <div class="tab">Profile</div>
            </div>

            <div class="buttons">
                <button class="b1">Login</button>
                <button class="b2">Sign up</button>
            </div>

        </div>

    </div>

    <div class="main-body">

        <div class="item">

            <div class="title1">
                Welcome back
            </div>

            <div class="title2">
                Log in to continue your campus journey.
            </div>

            <input
                class="input-field"
                type="email"
                placeholder="University email"
            >

            <input
                class="input-field"
                type="password"
                placeholder="Password"
            >
<div class="title3">
    <a href="#">Forgot password?</a>
</div>

<button class="Login">
    Login
</button>

<div class="title4">
    New to RideNest? <a href="register.html">Register</a>
</div>

        </div>

    </div>

</div>

</body>
</html>
